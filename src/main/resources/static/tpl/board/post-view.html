<!-- src/main/resources/static/tpl/board/post-view.html -->
<div
    class="board-shell"
    ng-cloak
>
    <!-- 상단 헤더 영역 (예전 디자인) -->
    <div class="section-header card-header-like">
        <div class="title-wrap">
            <span class="title-dot"></span>
            <h2 style="margin: 0">게시글 보기</h2>
        </div>
        <div class="header-actions">
            <button
                type="button"
                class="btn btn-outline"
                ng-click="backToList()"
            >
                목록으로
            </button>
        </div>
    </div>

    <!-- 로딩 중 -->
    <div
        class="card"
        ng-if="loading"
    >
        <div class="card-body">
            <p>⏳ 게시글을 불러오는 중입니다...</p>
        </div>
    </div>

    <!-- 게시글 없음 -->
    <div
        class="card"
        ng-if="!loading && !post"
    >
        <div class="card-body">
            <p>게시글을 찾을 수 없습니다.</p>
            <button
                type="button"
                class="btn btn-primary"
                ng-click="backToList()"
            >
                목록으로 돌아가기
            </button>
        </div>
    </div>

    <!-- 게시글 내용 -->
    <div
        class="card post-view-card"
        ng-if="!loading && post"
    >
        <div class="card-body">
            <!-- 제목 -->
            <h1
                class="post-title"
                style="margin-top: 0; margin-bottom: 8px"
            >
                {{ post.title }}
            </h1>

            <!-- 메타 정보 -->
            <div
                class="post-meta"
                style="font-size: 14px; color: #666; margin-bottom: 16px"
            >
                <span>작성자: {{ post.writerName || post.writerId || '알 수 없음' }}</span>
                <span ng-if="post.createdAt"> &nbsp;·&nbsp; {{ post.createdAt }} </span>
            </div>

            <!-- 본문 (이미지 토큰 치환된 renderedContent 사용) -->
            <div
                class="post-content"
                ng-bind-html="renderedContent"
            ></div>

            <!-- 첨부 파일 영역 -->
            <div
                class="post-attachments"
                ng-if="post.attachments && post.attachments.length"
                style="margin-top: 24px; border-top: 1px solid #eee; padding-top: 12px"
            >
                <div style="font-weight: 600; margin-bottom: 8px">첨부 파일</div>
                <ul style="list-style: none; padding: 0; margin: 0">
                    <li
                        ng-repeat="f in post.attachments"
                        style="margin-bottom: 4px"
                    >
                        <a
                            ng-href="{{f.url}}"
                            download="{{f.fileName || '파일'}}"
                        >
                            📎 {{ f.fileName || ('파일 ' + ($index + 1)) }}
                        </a>
                        <span
                            style="font-size: 12px; color: #888"
                            ng-if="f.size"
                        >
                            ({{ formatFileSize(f.size) }})</span
                        >
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
