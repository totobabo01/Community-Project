<!-- /roles.html -->
<div
    style="background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(31, 38, 135, 0.08); padding: 18px"
    ng-cloak
>
    <div style="background: #fbfdff; border: 1px solid #edf0f5; border-radius: 12px; padding: 18px">
        <!-- 헤더 -->
        <div class="section-header">
            <div class="section-title">
                <span class="dot"></span>
                <h2 style="margin: 0">권한 관리</h2>
            </div>

            <!-- 관리자만 상단 버튼 노출 -->
            <div
                class="actions"
                ng-show="isAdmin"
            >
                <button
                    type="button"
                    class="btn btn-ghost"
                    ng-click="load()"
                    ng-disabled="loading"
                >
                    새로 고침
                </button>
            </div>
        </div>

        <!-- 안내/상태 메시지 -->
        <div
            class="status-box"
            ng-if="msg"
            ng-class="{
        'status-success': msgType==='success',
        'status-error'  : msgType==='error',
        'status-info'   : msgType==='info'
      }"
        >
            {{ msg }}
        </div>

        <!-- 비관리자 전용 안내 -->
        <div
            class="status-box status-info"
            ng-if="!isAdmin"
        >
            🙏 이 페이지는 <strong>관리자 전용</strong>입니다.
        </div>

        <!-- 관리자 전용 영역 (스코프 분리 방지: ng-show 사용) -->
        <div ng-show="isAdmin">
            <!-- ▼▼ 검색 툴바 (DB 사용자 화면 톤) ▼▼ -->
            <style>
                .searchbar-row {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    gap: 12px;
                    margin: 10px 0 14px;
                }
                .search-toolbar {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    background: #fff;
                    border: 1px solid #e9eef5;
                    border-radius: 10px;
                    padding: 8px 10px;
                    flex-wrap: wrap;
                }
                .search-toolbar .select,
                .search-toolbar .inline-input {
                    height: 36px;
                    border: 1px solid #e3e9f3;
                    border-radius: 8px;
                    padding: 0 10px;
                    font-size: 14px;
                    outline: none;
                    background: #fbfdff;
                }
                .search-toolbar .select:hover,
                .search-toolbar .inline-input:focus {
                    border-color: #cfe0ff;
                    box-shadow: 0 0 0 3px rgba(76, 132, 255, 0.15);
                    background: #fff;
                }
                .search-toolbar .btn {
                    height: 36px;
                    padding: 0 14px;
                    border-radius: 8px;
                    background: #4c84ff;
                    color: #fff;
                    border: none;
                    font-weight: 500;
                    cursor: pointer;
                    transition: 0.2s;
                }
                .search-toolbar .btn:hover {
                    background: #3c73ef;
                }
                .page-size-select {
                    height: 36px;
                    border: 1px solid #e3e9f3;
                    border-radius: 8px;
                    padding: 0 8px;
                    background: #fff;
                }
                .muted {
                    color: #7a889e;
                }
                .pill {
                    display: inline-block;
                    border-radius: 999px;
                    padding: 4px 10px;
                    font-size: 12px;
                    font-weight: 700;
                }
                .pill.green {
                    background: #e8f8ec;
                    color: #169b55;
                    border: 1px solid #c9efd7;
                }
                .pill.gray {
                    background: #eef3ff;
                    color: #4c84ff;
                    border: 1px solid #d8e2ff;
                }
                .btn-page {
                    border: 1px solid #e1e7f0;
                    background: #fff;
                    border-radius: 8px;
                    padding: 6px 10px;
                    margin-left: 4px;
                    cursor: pointer;
                }
                .btn-page.active {
                    background: #4c84ff;
                    color: #fff;
                    border-color: #4c84ff;
                }
                .user-table {
                    width: 100%;
                    border-collapse: separate;
                    border-spacing: 0 8px;
                }
                .user-table thead th {
                    font-size: 13px;
                    color: #6a7a92;
                    text-align: left;
                    padding: 0 10px;
                }
                .user-table tbody tr {
                    background: #fff;
                    border: 1px solid #e9eef5;
                    border-radius: 10px;
                }
                .user-table tbody td {
                    padding: 12px 10px;
                }
                /* 🔢 가운데 숫자 버튼 묶음 (DB 사용자 화면과 동일 패턴) */
                .pager-pages {
                    display: inline-flex;
                    gap: 4px;
                    margin: 0 8px;
                    vertical-align: middle;
                }
            </style>

            <div class="searchbar-row">
                <div class="search-toolbar">
                    <!-- 검색 구분: 사용자 / 권한 -->
                    <select
                        class="select"
                        ng-model="q.type"
                        ng-change="applySearch()"
                    >
                        <option value="username">사용자</option>
                        <option value="role">권한</option>
                    </select>

                    <!-- 키워드 -->
                    <input
                        class="inline-input"
                        style="width: 220px"
                        ng-model="q.keyword"
                        placeholder="검색어 입력"
                        ng-keypress="($event.which===13)&&applySearch()"
                    />

                    <button
                        type="button"
                        class="btn"
                        ng-click="applySearch()"
                    >
                        검색
                    </button>

                    <button
                        type="button"
                        class="btn"
                        style="background: #eef3ff; color: #444"
                        ng-click="resetSearch()"
                    >
                        초기화
                    </button>
                </div>

                <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
                    <label class="muted">페이지 크기</label>

                    <!-- 숫자 바인딩 보장: + 단항연산자로 number 캐스팅 후 onSize() -->
                    <select
                        class="page-size-select"
                        ng-model="pageSize"
                        ng-options="s as s for s in pageSizes track by s"
                        ng-change="pageSize = +pageSize; onSize()"
                    ></select>

                    <span
                        class="muted"
                        style="margin-left: 4px"
                    >
                        총 {{ (filtered && filtered.length) || 0 }}건
                    </span>
                </div>
            </div>
            <!-- ▲▲ 검색 툴바 ▲▲ -->

            <!-- 표 -->
            <table
                class="user-table"
                aria-label="권한 목록"
            >
                <thead>
                    <tr>
                        <th style="width: 35%">사용자</th>
                        <th style="width: 35%">권한</th>
                        <th style="width: 30%">작업</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 페이징된 결과 -->
                    <tr ng-repeat="row in paged track by (row.username || $index)">
                        <td>{{ row.username }}</td>
                        <td>
                            <span
                                class="pill"
                                ng-class="{
                  green: (row.role||'').toUpperCase()==='ROLE_ADMIN',
                  gray : (row.role||'ROLE_USER').toUpperCase()!=='ROLE_ADMIN'
                }"
                            >
                                {{ (row.role || 'ROLE_USER') }}
                            </span>
                        </td>
                        <td>
                            <button
                                type="button"
                                class="btn btn-primary"
                                ng-disabled="saving || loading || (row.role||'').toUpperCase()==='ROLE_ADMIN'"
                                ng-click="changeRole(row,'ROLE_ADMIN')"
                            >
                                관리자 부여
                            </button>

                            <button
                                type="button"
                                class="btn btn-ghost"
                                ng-disabled="saving || loading || (row.role||'').toUpperCase()==='ROLE_USER'"
                                ng-click="changeRole(row,'ROLE_USER')"
                            >
                                관리자 해제
                            </button>
                        </td>
                    </tr>

                    <tr ng-if="!paged.length && !loading">
                        <td
                            colspan="3"
                            style="text-align: center; color: #666"
                        >
                            표시할 데이터가 없습니다.
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- 페이지네이션 -->
            <div
                class="pager"
                style="margin-top: 10px; display: flex; justify-content: space-between; align-items: center"
            >
                <div class="left">
                    <span class="muted"> 페이지 {{ (page || 0) + 1 }} / {{ pagesCount() }} </span>
                </div>
                <div class="right">
                    <button
                        type="button"
                        class="btn-page"
                        ng-click="first()"
                        ng-disabled="page<=0"
                    >
                        « 처음
                    </button>

                    <button
                        type="button"
                        class="btn-page"
                        ng-click="prev()"
                        ng-disabled="page<=0"
                    >
                        ‹ 이전
                    </button>

                    <!-- ✅ 가운데 숫자 버튼: pageRange() 기반 -->
                    <span class="pager-pages">
                        <button
                            type="button"
                            class="btn-page"
                            ng-repeat="p in pageRange() track by p"
                            ng-class="{active:p===page}"
                            ng-click="go(p)"
                        >
                            {{ p + 1 }}
                        </button>
                    </span>

                    <button
                        type="button"
                        class="btn-page"
                        ng-click="next()"
                        ng-disabled="page>=pagesCount()-1"
                    >
                        다음 ›
                    </button>

                    <button
                        type="button"
                        class="btn-page"
                        ng-click="last()"
                        ng-disabled="page>=pagesCount()-1"
                    >
                        끝 »
                    </button>
                </div>
            </div>
            <!-- /페이지네이션 -->
        </div>
    </div>
</div>
