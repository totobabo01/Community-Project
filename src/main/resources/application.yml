spring:
    application:
        name: user # 애플리케이션 이름(로그/Actuator 등에서 식별)
    jackson: # JSON 직렬화/역직렬화 기본 설정
        serialization:
            indent-output: true # JSON 보기 좋게 들여쓰기(Pretty-Print)
        date-format: yyyy-MM-dd HH:mm:ss # 날짜/시간 문자열 포맷(직렬화 시)
        time-zone: Asia/Seoul # 날짜/시간 직렬화 기준 타임존(한국 표준시)
    thymeleaf:
        cache: false # 개발 중 템플릿 캐시 비활성화(즉시 반영)

    # ✅ DataSource 표준 설정(스프링이 JdbcTemplate/트랜잭션 자동 구성)
    datasource:
        driver-class-name: org.mariadb.jdbc.Driver
        # ✅ 배포/이관 DB로 접속 (192.168.44.128 / ipp_db)
        url: jdbc:mariadb://192.168.44.128:3306/ipp_db
        username: demo_user
        password: '0000'

server:
    port: 8091 # 내장 서버 포트

logging:
    level:
        org.springframework.security: DEBUG # 로그인/인증 문제 추적용 디버그 로그

# 커스텀 네임스페이스(애플리케이션 내부에서 @ConfigurationProperties 또는 @Value로 사용 가능)
# ✅ (중요) 프로젝트 일부 DAO가 spring.datasource가 아니라 app.db.*를 직접 읽을 수 있으니
# ✅ spring.datasource와 완전히 동일하게 맞춰서 "설정 불일치"로 인한 Access denied를 방지
app:
    db:
        url: jdbc:mariadb://192.168.44.128:3306/ipp_db
        username: demo_user
        password: '0000'

